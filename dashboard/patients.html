<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitalTrack - Patients</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2334d399'/%3E%3Cpath d='M20 12h-3l-2 6-4-12-2 6H4' fill='none' stroke='%230a0d16' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button type="button" class="hamburger" id="hamburger" aria-label="Show or hide the menu"></button>
        <div>
          <h1 class="page-title">Patients</h1>
          <div class="page-subtitle">Manage patient records and ESP32 device assignments</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="topbar-stat"><span id="iconCalendar"></span><span id="topDate">--</span></div>
        <div class="topbar-stat"><span id="iconClock"></span><span id="topClock">--:--:--</span></div>
        <div class="admin-chip">
          <div class="avatar" id="adminAvatar">A</div>
          <span class="name" id="adminName">User</span>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="card">
        <div class="card-head">
          <div class="filter-tabs" id="filterTabs" role="tablist">
            <button type="button" class="filter-tab active" data-status="" role="tab" aria-selected="true">All</button>
            <button type="button" class="filter-tab" data-status="active" role="tab" aria-selected="false">Active</button>
            <button type="button" class="filter-tab" data-status="discharged" role="tab" aria-selected="false">Discharged</button>
          </div>
          <button type="button" class="btn" id="addPatientBtn" style="width:auto;"><span id="iconPlus"></span>Add Patient</button>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Patient</th>
                <th>Age / Gender</th>
                <th>Ward</th>
                <th>Status</th>
                <th>Device</th>
                <th style="text-align:right;">Actions</th>
              </tr>
            </thead>
            <tbody id="patientsTableBody"></tbody>
          </table>
        </div>
        <div id="patientsEmpty" class="empty-state hidden">No patients yet. Add your first patient to get started.</div>
      </div>
    </div>
  </main>
</div>

<!-- Add / Edit Patient -->
<div class="modal-backdrop hidden" id="patientModalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="patientModalTitle">
    <h3 id="patientModalTitle">Add Patient</h3>
    <form id="patientForm" novalidate>
      <input type="hidden" id="patientId" />
      <div id="patientFormError" class="auth-error hidden" role="alert"></div>
      <div class="form-row">
        <label for="pName">Full name</label>
        <input type="text" id="pName" maxlength="128" required />
      </div>
      <div class="form-grid-2">
        <div class="form-row">
          <label for="pAge">Age</label>
          <input type="number" id="pAge" min="0" max="130" />
        </div>
        <div class="form-row">
          <label for="pGender">Gender</label>
          <select id="pGender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <label for="pWard">Ward</label>
        <input type="text" id="pWard" maxlength="64" placeholder="e.g. General Ward" />
      </div>
      <div class="form-row">
        <label for="pStatus">Status</label>
        <select id="pStatus">
          <option value="active">Active</option>
          <option value="discharged">Discharged</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="patientCancelBtn">Cancel</button>
        <button type="submit" class="btn" id="patientSaveBtn">Save Patient</button>
      </div>
    </form>
  </div>
</div>

<!-- Device -->
<div class="modal-backdrop hidden" id="deviceModalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="deviceModalTitle">
    <h3 id="deviceModalTitle">Device Assignment</h3>
    <div id="deviceModalBody"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-outline" id="deviceCancelBtn">Close</button>
    </div>
  </div>
</div>

<!-- Delete -->
<div class="modal-backdrop hidden" id="deleteModalBackdrop">
  <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="deleteModalTitle">
    <h3 id="deleteModalTitle">Delete patient?</h3>
    <p id="deleteModalText" style="color:var(--text-secondary);font-size:13.5px;"></p>
    <div class="modal-actions">
      <button type="button" class="btn btn-outline" id="deleteCancelBtn">Cancel</button>
      <button type="button" class="btn btn-danger" id="deleteConfirmBtn">Delete</button>
    </div>
  </div>
</div>

<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/patients.js"></script>
</body>
</html>
