<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitalTrack - Alerts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2334d399'/%3E%3Cpath d='M20 12h-3l-2 6-4-12-2 6H4' fill='none' stroke='%230a0d16' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button type="button" class="hamburger" id="hamburger" aria-label="Show or hide the menu"></button>
        <div>
          <h1 class="page-title">Alerts</h1>
          <div class="page-subtitle">Threshold breaches across all patients</div>
        </div>
      </div>
      <div class="topbar-right">
        <select id="patientFilter" class="patient-select" aria-label="Filter by patient">
          <option value="">All Patients</option>
        </select>
        <div class="topbar-stat"><span id="iconCalendar"></span><span id="topDate">--</span></div>
        <div class="topbar-stat"><span id="iconClock"></span><span id="topClock">--:--:--</span></div>
        <div class="admin-chip">
          <div class="avatar" id="adminAvatar">A</div>
          <span class="name" id="adminName">User</span>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="card">
        <div class="card-head">
          <div class="filter-tabs" id="filterTabs" role="tablist">
            <button type="button" class="filter-tab active" data-filter="all" role="tab" aria-selected="true">All</button>
            <button type="button" class="filter-tab" data-filter="unread" role="tab" aria-selected="false">Unread</button>
          </div>
          <button type="button" class="btn btn-outline" id="markAllReadBtn" style="width:auto;"><span id="iconCheck"></span>Mark all as read</button>
        </div>
        <div id="alertsList"></div>
        <div id="alertsEmpty" class="empty-state hidden">No alerts to show.</div>
        <div id="alertsNote" class="last-updated hidden"></div>
      </div>
    </div>
  </main>
</div>

<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/alerts.js"></script>
</body>
</html>
